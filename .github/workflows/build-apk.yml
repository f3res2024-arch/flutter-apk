name: Build Nova APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create . --platforms=android --project-name delivery --org nova
          # Generate the Android package directly as nova.delivery so the
          # MainActivity package, namespace, and application id all agree.
          sed -i 's/android:label="[^"]*"/android:label="نوفا ديليفري"/' android/app/src/main/AndroidManifest.xml
          grep -R 'package nova.delivery' android/app/src/main/kotlin android/app/src/main/java
          grep -n 'applicationId = "nova.delivery"' android/app/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Nova app icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: flutter build apk --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-delivery-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
