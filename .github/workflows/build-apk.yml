name: Build Nova APK
# Trigger a fresh release build after manifest generation fix

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create . --platforms=android,ios,web --project-name delivery --org nova
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)

          tree = ET.parse(manifest)
          root = tree.getroot()
          for perm in ["android.permission.INTERNET","android.permission.ACCESS_COARSE_LOCATION","android.permission.ACCESS_FINE_LOCATION"]:
              if not any(p.get(f"{{{android_ns}}}name") == perm for p in root.findall("uses-permission")):
                  ET.SubElement(root, "uses-permission", {f"{{{android_ns}}}name": perm})
          application = root.find("application")
          if application is None:
              raise SystemExit("AndroidManifest.xml has no <application> element")

          application.set(f"{{{android_ns}}}label", "نوفا ديليفري")

          activity = None
          for candidate in application.findall("activity"):
              if any(
                  intent.find("action").get(f"{{{android_ns}}}name") == "android.intent.action.MAIN"
                  for intent in candidate.findall("intent-filter")
                  if intent.find("action") is not None and intent.find("action").get(f"{{{android_ns}}}name")
              ):
                  activity = candidate
                  break

          if activity is None:
              raise SystemExit("Could not locate the launcher activity in AndroidManifest.xml")

          # Remove an old Nova callback filter if the template ever already contains one.
          for intent in list(activity.findall("intent-filter")):
              data = intent.find("data")
              if data is not None and data.get(f"{{{android_ns}}}scheme") == "nova" and data.get(f"{{{android_ns}}}host") == "auth-callback":
                  activity.remove(intent)

          callback = ET.SubElement(activity, "intent-filter")
          ET.SubElement(callback, "action", {f"{{{android_ns}}}name": "android.intent.action.VIEW"})
          ET.SubElement(callback, "category", {f"{{{android_ns}}}name": "android.intent.category.DEFAULT"})
          ET.SubElement(callback, "category", {f"{{{android_ns}}}name": "android.intent.category.BROWSABLE"})
          ET.SubElement(callback, "data", {
              f"{{{android_ns}}}scheme": "nova",
              f"{{{android_ns}}}host": "auth-callback",
          })

          tree.write(manifest, encoding="utf-8", xml_declaration=False)
          ET.parse(manifest)
          print("AndroidManifest.xml validated successfully")
          PY
          python3 -c "from pathlib import Path; p=Path('ios/Runner/Info.plist'); s=p.read_text(); loc='\n\t<key>NSLocationWhenInUseUsageDescription</key>\n\t<string>نوفا تحتاج موقعك لإظهار موقعك على الخريطة والمطاعم القريبة.</string>'; s=s.replace('</dict>\n</plist>', loc+'\n</dict>\n</plist>'); block='\n\t<key>CFBundleURLTypes</key>\n\t<array><dict><key>CFBundleTypeRole</key><string>Editor</string><key>CFBundleURLSchemes</key><array><string>nova</string></array></dict></array>'; s=s.replace('</dict>\n</plist>', block+'\n</dict>\n</plist>'); p.write_text(s)"
          grep -R 'package nova.delivery' android/app/src/main/kotlin android/app/src/main/java
          grep -n 'applicationId = "nova.delivery"' android/app/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Nova app icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Validate Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL GitHub secret" && exit 1)
          test -n "$SUPABASE_PUBLISHABLE_KEY" || (echo "Missing SUPABASE_PUBLISHABLE_KEY GitHub secret" && exit 1)
          case "$SUPABASE_URL" in https://*.supabase.co) ;; *) echo "SUPABASE_URL format is invalid"; exit 1;; esac
          status=$(curl -sS -o /tmp/supabase-settings.json -w "%{http_code}" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" "$SUPABASE_URL/auth/v1/settings")
          test "$status" = "200" || (echo "Supabase Auth endpoint rejected the GitHub secrets (HTTP $status)" && cat /tmp/supabase-settings.json && exit 1)

      - name: Build Web preview
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: flutter build web --release --base-href /flutter-apk/ --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload Web preview
        uses: actions/upload-artifact@v4
        with:
          name: nova-delivery-web
          path: build/web
          if-no-files-found: error

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: flutter build apk --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-delivery-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
