name: Build Nova APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create . --platforms=android,ios --project-name delivery --org nova
          # Generate the Android package directly as nova.delivery so the
          # MainActivity package, namespace, and application id all agree.
          sed -i 's/android:label="[^"]*"/android:label="نوفا ديليفري"/' android/app/src/main/AndroidManifest.xml
          python3 -c "from pathlib import Path; p=Path('android/app/src/main/AndroidManifest.xml'); s=p.read_text(); s=s.replace('</activity>', '<intent-filter><action android:name=\"android.intent.action.VIEW\"/><category android:name=\"android.intent.category.DEFAULT\"/><category android:name=\"android.intent.category.BROWSABLE\"/><data android:scheme=\"nova\" android:host=\"auth-callback\"/></intent-filter></activity>', 1); p.write_text(s)"
          python3 -c "from pathlib import Path; p=Path('ios/Runner/Info.plist'); s=p.read_text(); block='\\n\\t<key>CFBundleURLTypes</key>\\n\\t<array><dict><key>CFBundleTypeRole</key><string>Editor</string><key>CFBundleURLSchemes</key><array><string>nova</string></array></dict></array>'; s=s.replace('</dict>\\n</plist>', block+'\\n</dict>\\n</plist>'); p.write_text(s)"
          grep -R 'package nova.delivery' android/app/src/main/kotlin android/app/src/main/java
          grep -n 'applicationId = "nova.delivery"' android/app/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Nova app icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Validate Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL GitHub secret" && exit 1)
          test -n "$SUPABASE_PUBLISHABLE_KEY" || (echo "Missing SUPABASE_PUBLISHABLE_KEY GitHub secret" && exit 1)

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: flutter build apk --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-delivery-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
